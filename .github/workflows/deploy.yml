name: Deploy Testimonials MFE to Google Cloud Storage

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bucket:
        description: 'Target GCS Bucket Name'
        required: true
        default: 'mycommerce'
        type: string
      dest_dir:
        description: 'Destination Directory inside Bucket'
        required: true
        default: 'mfes/testimonials-ui'
        type: string

jobs:
  deploy:
    name: Call Reusable GCS Deployment
    uses: dipeshsingh2012/shared-workflows/.github/workflows/deploy-mfe-gcs.yml@main
    with:
      dest_dir: ${{ inputs.dest_dir || 'mfes/testimonials-ui' }}
      bucket: ${{ inputs.bucket || 'mycommerce' }}
      node_version: '20'
      build_command: 'npm run build'
      dist_dir: 'dist'
    secrets:
      gcp_sa_key: ${{ secrets.GCP_SA_KEY }}
